<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relógio — Rio de Janeiro</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07111f; }
    #ablesign-clock-preview { min-height: 100vh !important; }
  </style>
</head>
<body>
<div id="ablesign-clock-preview">
  <div class="ac-glow ac-glow-one"></div>
  <div class="ac-glow ac-glow-two"></div>
  <main class="ac-panel" aria-label="Relógio do Rio de Janeiro">
    <div class="ac-eyebrow"><span></span> HORA LOCAL <span></span></div>
    <div class="ac-city">RIO DE JANEIRO</div>
    <div class="ac-time-row" aria-live="polite">
      <span id="ac-main-time">00:00</span><span id="ac-seconds">00</span>
    </div>
    <div class="ac-rule"></div>
    <div id="ac-weekday">DOMINGO</div>
    <div id="ac-date">23 DE AGOSTO DE 2026</div>
    <div class="ac-zone"><span class="ac-dot"></span> America/Sao_Paulo</div>
  </main>
</div>

<style>
  #ablesign-clock-preview {
    position: relative;
    isolation: isolate;
    width: 100%;
    min-height: 560px;
    overflow: hidden;
    display: grid;
    place-items: center;
    box-sizing: border-box;
    padding: clamp(28px, 6vw, 72px);
    color: #f8fafc;
    background:
      radial-gradient(circle at 50% 45%, rgba(14, 116, 144, .12), transparent 38%),
      linear-gradient(145deg, #07111f 0%, #0a1629 48%, #08111f 100%);
    font-family: Arial, Helvetica, sans-serif;
  }
  #ablesign-clock-preview * { box-sizing: border-box; }
  #ablesign-clock-preview .ac-glow {
    position: absolute;
    z-index: -1;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .16;
  }
  #ablesign-clock-preview .ac-glow-one { top: -230px; left: -120px; background: #22d3ee; }
  #ablesign-clock-preview .ac-glow-two { right: -170px; bottom: -260px; background: #2563eb; }
  #ablesign-clock-preview .ac-panel {
    width: min(920px, 100%);
    text-align: center;
    transform: translate3d(0, 0, 0);
  }
  #ablesign-clock-preview .ac-eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #7dd3fc;
    font-size: clamp(11px, 1.5vw, 15px);
    font-weight: 700;
    letter-spacing: .34em;
  }
  #ablesign-clock-preview .ac-eyebrow span { width: 34px; height: 1px; background: rgba(125, 211, 252, .45); }
  #ablesign-clock-preview .ac-city {
    margin-top: 11px;
    color: #94a3b8;
    font-size: clamp(12px, 1.6vw, 17px);
    font-weight: 600;
    letter-spacing: .42em;
  }
  #ablesign-clock-preview .ac-time-row {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: clamp(10px, 2vw, 24px);
    margin: clamp(25px, 5vw, 46px) 0 clamp(25px, 4vw, 39px);
    font-variant-numeric: tabular-nums;
    line-height: .82;
  }
  #ablesign-clock-preview #ac-main-time {
    color: #ffffff;
    font-size: clamp(84px, 20vw, 320px);
    font-weight: 700;
    letter-spacing: -.075em;
    text-shadow: 0 0 45px rgba(56, 189, 248, .08);
  }
  #ablesign-clock-preview #ac-seconds {
    min-width: 1.25em;
    color: #38bdf8;
    font-size: clamp(27px, 6vw, 66px);
    font-weight: 700;
    letter-spacing: -.04em;
  }
  #ablesign-clock-preview .ac-rule {
    width: min(480px, 70%);
    height: 1px;
    margin: 0 auto clamp(22px, 4vw, 34px);
    background: linear-gradient(90deg, transparent, rgba(148, 163, 184, .35), transparent);
  }
  #ablesign-clock-preview #ac-weekday {
    color: #e2e8f0;
    font-size: clamp(22px, 4.3vw, 44px);
    font-weight: 700;
    letter-spacing: .2em;
  }
  #ablesign-clock-preview #ac-date {
    margin-top: 12px;
    color: #94a3b8;
    font-size: clamp(13px, 2.3vw, 22px);
    font-weight: 500;
    letter-spacing: .14em;
  }
  #ablesign-clock-preview .ac-zone {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: clamp(38px, 7vw, 65px);
    color: #64748b;
    font-size: 11px;
    letter-spacing: .08em;
  }
  #ablesign-clock-preview .ac-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 10px rgba(34, 197, 94, .7);
  }
  @media (max-width: 500px) {
    #ablesign-clock-preview { min-height: 620px; padding-inline: 18px; }
    #ablesign-clock-preview .ac-time-row { gap: 8px; }
    #ablesign-clock-preview #ac-main-time { font-size: clamp(70px, 22vw, 104px); }
    #ablesign-clock-preview .ac-eyebrow { letter-spacing: .24em; }
  }
  @media (orientation: portrait) {
    #ablesign-clock-preview {
      min-height: 720px;
      padding: 9vh 6vw;
    }
    #ablesign-clock-preview .ac-time-row {
      margin-block: 8vh 6vh;
    }
    #ablesign-clock-preview #ac-main-time {
      font-size: clamp(74px, 24vw, 230px);
    }
    #ablesign-clock-preview #ac-seconds {
      font-size: clamp(25px, 7vw, 64px);
    }
    #ablesign-clock-preview .ac-zone {
      margin-top: 8vh;
    }
  }
  @media (min-aspect-ratio: 2 / 1) {
    #ablesign-clock-preview {
      min-height: 440px;
      padding-block: 30px;
    }
    #ablesign-clock-preview .ac-time-row {
      margin-block: 28px 24px;
    }
    #ablesign-clock-preview .ac-zone {
      margin-top: 30px;
    }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    #ablesign-clock-preview {
      min-height: 400px;
      padding-block: 22px;
    }
    #ablesign-clock-preview .ac-city { margin-top: 6px; }
    #ablesign-clock-preview .ac-time-row { margin-block: 24px 20px; }
    #ablesign-clock-preview .ac-rule { margin-bottom: 20px; }
    #ablesign-clock-preview .ac-zone { margin-top: 22px; }
  }
</style>

<script>
  (function () {
    const root = document.getElementById('ablesign-clock-preview');
    const mainTime = root.querySelector('#ac-main-time');
    const seconds = root.querySelector('#ac-seconds');
    const weekday = root.querySelector('#ac-weekday');
    const date = root.querySelector('#ac-date');
    const zone = 'America/Sao_Paulo';

    function partMap(value, options) {
      return Object.fromEntries(new Intl.DateTimeFormat('pt-BR', options).formatToParts(value).map(p => [p.type, p.value]));
    }

    function updateClock() {
      const now = new Date();
      const t = partMap(now, { timeZone: zone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      const d = partMap(now, { timeZone: zone, weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      mainTime.textContent = t.hour + ':' + t.minute;
      seconds.textContent = t.second;
      weekday.textContent = d.weekday.toUpperCase();
      date.textContent = `${d.day} DE ${d.month.toUpperCase()} DE ${d.year}`;
    }

    function schedule() {
      updateClock();
      setTimeout(schedule, 1000 - (Date.now() % 1000) + 15);
    }

    schedule();
  })();
</script>

</body>
</html>
